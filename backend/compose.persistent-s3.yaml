# Alternativa local isolada; não substitui automaticamente o LocalStack nem valida R2.
name: margem-persistent-s3
services:
  objectstore:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - '127.0.0.1:59017:8333'
    volumes:
      - s3data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8333/status']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  s3data:
